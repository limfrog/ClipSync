name: Publish installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            artifact: Windows
            files: release/installers/*-Setup.exe
          - os: macos-latest
            command: dist:mac
            artifact: macOS
            files: release/installers/ClipSync-*-macOS-*.pkg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v = JSON.parse(fs.readFileSync("package.json")).version; if (process.env.GITHUB_REF_NAME !== `v${v}`) throw new Error("Tag and package version differ")'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS app signatures and packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in release/installers/mac*/ClipSync.app; do
            codesign --verify --deep --strict "$app"
          done
          for pkg in release/installers/ClipSync-*-macOS-*.pkg; do
            pkgutil --expand "$pkg" "$RUNNER_TEMP/$(basename "$pkg").expanded"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Check assets and record SHA-256
        working-directory: release-assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('.').glob('ClipSync-*'))
          assert len(files) == 3, 'Expected one Windows and two macOS installers'
          assert len([p for p in files if p.suffix == '.exe']) == 1
          assert len([p for p in files if p.suffix == '.pkg']) == 2
          lines = []
          for file in files:
              assert 1_000_000 < file.stat().st_size <= 500_000_000, file.name
              with file.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              lines.append(f'{digest}  {file.name}\n')
          Path('SHA256SUMS.txt').write_text(''.join(lines))
          PY
          sha256sum -c SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "ClipSync ${RELEASE_TAG#v}" --notes-file docs/release-notes.md
