name: Publish installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          tag="v$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json")).version')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo 'Tag and package version differ' >&2
            exit 1
          fi
          git rev-parse --verify "$tag^{commit}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: dist:win
            artifact: Windows
            files: release/installers/*-Setup.exe
          - os: macos-26-intel
            command: dist:mac
            artifact: macOS
            files: release/installers/ClipSync-*-macOS-*.pkg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v = JSON.parse(fs.readFileSync("package.json")).version; if (process.env.RELEASE_TAG !== `v${v}`) throw new Error("Tag and package version differ")'
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - name: Build installer
        shell: bash
        run: |
          set +e
          npm run ${{ matrix.command }} 2>&1 | tee "$RUNNER_TEMP/installer-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" != 0 ]]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ['RUNNER_TEMP'], 'installer-build.log').read_text(errors='replace').splitlines()[-35:]
          message = '\n'.join(lines).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{message}')
          PY
            exit "$result"
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS app signatures and packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in release/installers/mac*/ClipSync.app; do
            codesign --verify --deep --strict "$app"
            /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$app/Contents/Info.plist"
          done
          for pkg in release/installers/ClipSync-*-macOS-*.pkg; do
            pkgutil --expand "$pkg" "$RUNNER_TEMP/$(basename "$pkg").expanded"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Check assets and record SHA-256
        working-directory: release-assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('.').glob('ClipSync-*'))
          assert len(files) == 3, 'Expected one Windows and two macOS installers'
          assert len([p for p in files if p.suffix == '.exe']) == 1
          assert len([p for p in files if p.suffix == '.pkg']) == 2
          lines = []
          for file in files:
              assert 1_000_000 < file.stat().st_size <= 500_000_000, file.name
              with file.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              lines.append(f'{digest}  {file.name}\n')
          Path('SHA256SUMS.txt').write_text(''.join(lines))
          PY
          sha256sum -c SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "ClipSync ${RELEASE_TAG#v}" --notes-file docs/release-notes.md
