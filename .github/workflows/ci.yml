name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Tests
        shell: bash
        run: bash scripts/check-ci.sh test
      - run: npm run build
      - name: Verify native resize, history restore and focus behavior
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/check-ci.sh test:history
      - name: Verify Windows native titlebar regions and connection restore
        if: runner.os == 'Windows'
        run: node scripts/test-desktop.mjs tests/desktop.persistence.ts
      - name: Package Windows app for native startup verification
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.config.cjs --win --x64 --dir --publish never
      - name: Verify Windows startup registration and hidden launch
        if: runner.os == 'Windows'
        run: |
          $startupTestFolder = Join-Path $env:RUNNER_TEMP 'ClipSync 설치 검증'
          New-Item -ItemType Directory -Force -Path $startupTestFolder | Out-Null
          Copy-Item 'release/installers/win-unpacked/*' -Destination $startupTestFolder -Recurse -Force
          $env:CLIPSYNC_EXECUTABLE = Join-Path $startupTestFolder 'ClipSync.exe'
          bash scripts/check-ci.sh test:startup
      - name: Package installed Intel Mac app for native startup verification
        if: matrix.os == 'macos-26-intel'
        run: |
          npx electron-builder --config electron-builder.config.cjs --mac --x64 --dir --publish never
          sudo ditto release/installers/mac/ClipSync.app /Applications/ClipSync.app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Mac startup registration and hidden launch
        if: matrix.os == 'macos-26-intel'
        run: bash scripts/check-ci.sh test:startup
        env:
          CLIPSYNC_EXECUTABLE: /Applications/ClipSync.app/Contents/MacOS/ClipSync
      - run: sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11 openbox xdotool
        if: runner.os == 'Linux'
      - run: bash scripts/check-ci.sh test:desktop
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: bash scripts/check-ci.sh test:persistence
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - name: Verify resized history manager with native keyring
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/test-with-keyring.sh bash scripts/check-ci.sh test:history
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: npm run package
        if: runner.os == 'Linux'
      - run: bash scripts/check-ci.sh test:pair
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: bash scripts/check-ci.sh test:large
        if: runner.os == 'Linux'
