name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Tests
        shell: bash
        run: bash scripts/check-ci.sh test
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11 openbox xdotool
        if: runner.os == 'Linux'
      - run: bash scripts/check-ci.sh test:desktop
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: bash scripts/check-ci.sh test:persistence
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: npm run package
        if: runner.os == 'Linux'
      - run: bash scripts/check-ci.sh test:pair
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: bash scripts/check-ci.sh test:large
        if: runner.os == 'Linux'
