name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/clipsync-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" != 0 ]]; then
            node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; const lines = fs.readFileSync(path.join(process.env.RUNNER_TEMP, "clipsync-tests.log"), "utf8").split(/\r?\n/).slice(-85).join("\n"); console.log("::error::" + lines.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A"));'
            exit "$result"
          fi
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y xvfb gnome-keyring dbus-x11 openbox xdotool
        if: runner.os == 'Linux'
      - run: npm run test:desktop
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: npm run test:persistence
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: npm run package
        if: runner.os == 'Linux'
      - run: npm run test:pair
        if: runner.os == 'Linux'
        env:
          CLIPSYNC_TEST_NO_SANDBOX: '1'
      - run: npm run test:large
        if: runner.os == 'Linux'
